<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editor — Minimalism</title>
  <style>
  /* Абсолютный реальный минимализм (inlined) */
  :root{color-scheme: light dark}
  html,body{height:100%;}
  body{
    margin:0;
    background: #fff;
    color:#000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    padding:18px; /* небольшая зона для пальцев */
    box-sizing:border-box;
  }
  textarea{
    width:100%;
    max-width:100%;
    box-sizing:border-box;
    flex:1 1 100%;
    min-width:0;
    display:block;
    resize:none;
    border:0;
    outline:0;
    font-size:18px;
    line-height:1.5;
    padding:0;
    background:transparent;
    color:inherit;
    caret-color: #111;
    -webkit-appearance:none;
  }
  textarea::placeholder{color:#999}

  #debug{
    position:fixed;
    left:0;
    right:0;
    top:0;
    background:rgba(0,0,0,0.6);
    color:#fff;
    font-size:12px;
    padding:6px 10px;
    text-align:center;
    z-index:9999;
    backdrop-filter: blur(4px);
  }

  .wrap{padding-top:38px}

  @media (prefers-color-scheme: dark){
    body{background:#0b0b0c;color:#e6e6e6}
    textarea::placeholder{color:#666}
  }

  textarea:-webkit-autofill{background:transparent}
  </style>
</head>
<body>
  <main class="wrap">
    <div id="debug" aria-hidden="true"></div>
    <div id="ta-wrap">
      <textarea id="editor" placeholder="Start typing…" autofocus></textarea>
      <span id="global-timer" aria-hidden="true"></span>
    </div>
    <!-- Floating action button and menu -->
    <button id="fab" aria-label="Menu" title="Menu">≡</button>
    <div id="menu" aria-hidden="true">
      <button data-action="start-60">Start timer 60s</button>
      <button data-action="start-90">Start timer 90s</button>
      <button data-action="reset">Reset timer</button>
      <div class="sep"></div>
      <button data-action="insert-time">Insert current time HH:MM:SS</button>
      <div class="sep"></div>
      <button data-action="insert-word" data-word="PullUps">Insert PullUps</button>
      <button data-action="insert-word" data-word="PushUps">Insert PushUps</button>
      <button data-action="insert-word" data-word="Abs">Insert Abs</button>
      <button data-action="insert-word" data-word="Lunges">Insert Lunges</button>
    </div>
    <!-- Countdown overlay (pointer-events:none — does not block textarea) -->
    <div id="overlay" aria-hidden="true"><div id="overlay-text"></div></div>
  </main>
  <script>
    // Авто-увеличивающаяся высота textarea
    const ta = document.getElementById('editor');
    function fit() {
      ta.style.height = 'auto';
      ta.style.height = (ta.scrollHeight) + 'px';
    }
    ta.addEventListener('input', fit, {passive:true});
    window.addEventListener('load', fit);
    window.addEventListener('resize', fit);
    // Save draft in sessionStorage
    const KEY = 'minimal-editor-draft';
    ta.value = sessionStorage.getItem(KEY) || '';
    ta.addEventListener('input', () => sessionStorage.setItem(KEY, ta.value));

    // --- UI elements ---
    const fab = document.getElementById('fab');
    const menu = document.getElementById('menu');
    const overlay = document.getElementById('overlay');
    const overlayText = document.getElementById('overlay-text');
    const globalTimerEl = document.getElementById('global-timer');

    // Inline small beep (base64 WAV) — short click-like tone
    const beepData = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
    function playBeep(){
      const a = new Audio(beepData);
      a.play().catch(()=>{});
    }

    // --- Draggable FAB ---
    let fabMoved = false, fabOffset = [0,0];
    fab.addEventListener('pointerdown', e=>{
      fabMoved = false;
      fabOffset = [e.clientX - fab.offsetLeft, e.clientY - fab.offsetTop];
      fab.setPointerCapture(e.pointerId);
    });
    fab.addEventListener('pointermove', e=>{
      if(!(e.buttons & 1)) return;
      fabMoved = true;
      let x = Math.max(0, Math.min(window.innerWidth-48, e.clientX - fabOffset[0]));
      let y = Math.max(0, Math.min(window.innerHeight-48, e.clientY - fabOffset[1]));
      fab.style.left = x+'px'; fab.style.top = y+'px';
      fab.style.right = 'auto'; fab.style.bottom = 'auto';
    });
    fab.addEventListener('pointerup', e=>{ fab.releasePointerCapture(e.pointerId); });
    // Menu toggle — only on click (not after drag)
    fab.addEventListener('click', e=>{
      if(fabMoved){ fabMoved=false; return; }
      const open = menu.getAttribute('aria-hidden') === 'false';
      menu.setAttribute('aria-hidden', String(!open));
      menu.style.display = open ? 'none' : 'flex';
    });

    // Handle menu actions
    menu.addEventListener('click', (e)=>{
      const b = e.target.closest('button');
      if(!b) return;
      const action = b.dataset.action;
      if(action === 'start-60') startCountdown(60);
      if(action === 'start-90') startCountdown(90);
      if(action === 'reset') stopCountdown();
      if(action === 'insert-time') insertCurrentTime();
      if(action === 'insert-word') insertAtCursor(b.dataset.word + ' ');
      menu.setAttribute('aria-hidden','true'); menu.style.display='none';
    });

    // Countdown overlay
    let countdownTimer = null;
    function startCountdown(seconds){
      stopCountdown();
      let remaining = seconds;
      overlay.style.display = 'flex';
      overlay.setAttribute('aria-hidden','false');
      overlayText.textContent = formatSeconds(remaining);
      countdownTimer = setInterval(()=>{
        remaining -= 1;
        if(remaining <= 0){ stopCountdown(); playBeep(); }
        else overlayText.textContent = formatSeconds(remaining);
      },1000);
    }
    function stopCountdown(){
      if(countdownTimer) clearInterval(countdownTimer);
      countdownTimer = null;
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden','true');
    }

    function formatSeconds(s){
      return String(s);
    }

    function insertCurrentTime(){
      const d = new Date();
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      const ss = String(d.getSeconds()).padStart(2,'0');
      insertAtCursor(`${hh}:${mm}:${ss} `);
    }

    function insertAtCursor(text){
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const val = ta.value;
      ta.value = val.slice(0,start) + text + val.slice(end);
      const pos = start + text.length;
      ta.selectionStart = ta.selectionEnd = pos;
      ta.focus();
      fit(); updateDebug();
    }

    // Global timer: shows elapsed time since the moment recorded in first line
    let globalInterval = null;
    function parseFirstLineTime(){
      const firstLine = ta.value.split('\n')[0].trim();
      const m = firstLine.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
      if(!m) return null;
      const hh = Number(m[1]), mm = Number(m[2]), ss = Number(m[3]||0);
      const t = new Date();
      t.setHours(hh, mm, ss, 0);
      return t;
    }
    function formatHMS(s){
      const sign = s < 0 ? '-' : '';
      s = Math.abs(s);
      const hh = String(Math.floor(s/3600)).padStart(2,'0');
      const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
      const sss = String(s%60).padStart(2,'0');
      return sign+hh+':'+mm+':'+sss;
    }
    function updateGlobalTimer(){
      const t = parseFirstLineTime();
      if(!t){ globalTimerEl.style.display='none'; return; }
      globalTimerEl.style.display = 'block';
      const diff = Math.floor((Date.now() - t.getTime()) / 1000);
      globalTimerEl.textContent = formatHMS(diff);
    }
    function startGlobalIfNeeded(){
      if(globalInterval) clearInterval(globalInterval);
      updateGlobalTimer();
      const t = parseFirstLineTime();
      if(!t) return;
      globalInterval = setInterval(updateGlobalTimer, 1000);
    }
    ta.addEventListener('input', startGlobalIfNeeded);
    window.addEventListener('resize', updateGlobalTimer);
    startGlobalIfNeeded();

    // Отладочная информация: размеры экрана, viewport и textarea
    const dbg = document.getElementById('debug');
    function updateDebug(){
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const docW = document.documentElement.clientWidth;
      const docH = document.documentElement.clientHeight;
      const r = ta.getBoundingClientRect();
      dbg.textContent = `window: ${winW}×${winH}  viewport: ${docW}×${docH}  textarea: ${Math.round(r.width)}×${Math.round(r.height)}`;
    }
    window.addEventListener('resize', updateDebug);
    window.addEventListener('orientationchange', updateDebug);
    ta.addEventListener('input', updateDebug, {passive:true});
    window.addEventListener('load', updateDebug);
    // initial
    updateDebug();
  </script>
  <style>
  /* UI for menu, FAB and overlay */
  #fab{position:fixed;right:12px;top:12px;width:48px;height:48px;border-radius:24px;border:0;background:#111;color:#fff;font-size:20px;z-index:10001;touch-action:none;cursor:grab;}
  #menu{position:fixed;right:12px;top:72px;display:none;flex-direction:column;background:rgba(255,255,255,0.98);border-radius:8px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,0.12);z-index:10000;min-width:180px}
  #menu button{background:transparent;border:0;padding:10px 12px;text-align:left;font-size:15px}
  #menu .sep{height:1px;background:#eee;margin:6px 0}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:transparent;z-index:10002;pointer-events:none;}
  #overlay-text{font-size:200px;color:rgba(0,0,0,0.6);background:transparent;padding:6px 0;border-radius:0;pointer-events:none;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Courier New', monospace;line-height:0.9;letter-spacing:-6px;width:400px;text-align:center}
  #ta-wrap{position:relative;width:100%;overflow:visible}
  #global-timer{display:none;position:absolute;top:0;right:0;background:transparent;color:rgba(0,0,0,0.6);font-size:18px;line-height:1.5;font-family:inherit;padding:0;pointer-events:none;white-space:nowrap;width:400px;max-width:400px;text-align:right;overflow:visible}
  @media (prefers-color-scheme: dark){
    #overlay-text{color:rgba(255,255,255,0.65)}
    #global-timer{color:rgba(255,255,255,0.65)}
  }
  @media (prefers-color-scheme: dark){#menu{background:rgba(18,18,18,0.95);color:#ddd}#menu button{color:inherit}#fab{background:#e6e6e6;color:#111}}
  </style>
</body>
</html>
